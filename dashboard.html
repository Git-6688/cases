<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诸神黄昏 · 仪表盘</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-light: #3b82f6;
        --primary-dark: #1d4ed8;
        --gold: #d97706;
        --gold-light: #f59e0b;
        --gold-dark: #92400e;
        --bg-1: #f0f7ff;
        --bg-2: #e0ecf8;
        --bg-panel: #ffffff;
        --text: #0f172a;
        --text-dim: #334155;
        --text-muted: #64748b;
        --border: #dbeafe;
        --border-strong: #bfdbfe;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #dc2626;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(180deg, #f0f7ff 0%, #e0ecf8 40%, #dbeafe 100%);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
      }

      .layout { min-height: 100vh; display: flex; }

      /* 侧边栏 */
      .sidebar {
        width: 220px;
        background: #ffffff;
        border-right: 1px solid #dbeafe;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        box-shadow: 2px 0 12px rgba(37, 99, 235, 0.04);
      }

      .sidebar-logo {
        padding: 24px 20px;
        text-align: center;
        border-bottom: 1px solid #dbeafe;
      }

      .sidebar-logo-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 6px;
        background: linear-gradient(180deg, #ffd88c 0%, #d97706 60%, #92400e 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sidebar-logo-sub {
        margin-top: 6px;
        font-size: 10px;
        color: var(--primary-dark);
        letter-spacing: 4px;
        font-weight: 500;
      }

      .sidebar-menu { flex: 1; padding: 16px 12px; }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        margin-bottom: 4px;
        border-radius: 3px;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.15s, color 0.15s;
        user-select: none;
      }

      .menu-item:hover { background: #eff6ff; color: var(--primary-dark); }
      .menu-item.active {
        background: #dbeafe;
        color: var(--primary-dark);
        border-left: 2px solid var(--primary);
        padding-left: 12px;
        font-weight: 600;
      }

      .menu-item .icon { width: 16px; height: 16px; flex-shrink: 0; }

      .sidebar-footer {
        padding: 16px;
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        border-top: 1px solid #dbeafe;
        letter-spacing: 2px;
      }

      /* 主区域 */
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

      .topbar {
        background: #ffffff;
        border-bottom: 1px solid #dbeafe;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 4px rgba(37, 99, 235, 0.04);
      }

      .breadcrumb { color: var(--text-dim); font-size: 13px; font-weight: 500; }
      .breadcrumb .sep { margin: 0 8px; color: var(--text-muted); }
      .breadcrumb .current { color: var(--primary-dark); font-weight: 600; }

      .user-info { display: flex; align-items: center; gap: 12px; }
      .user-avatar {
        width: 34px; height: 34px; border-radius: 3px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #fff; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px;
      }
      .user-detail { text-align: right; }
      .user-name { font-size: 13px; color: var(--text); font-weight: 600; }
      .user-role { font-size: 11px; color: var(--text-dim); }

      .logout-btn {
        margin-left: 12px; padding: 6px 14px; font-size: 12px;
        background: #fef2f2; border: 1px solid #fecaca;
        color: var(--danger); border-radius: 3px;
        cursor: pointer; font-family: inherit; transition: all 0.15s;
        font-weight: 600;
      }
      .logout-btn:hover { background: #fee2e2; border-color: #fca5a5; }

      /* 内容 */
      .content { padding: 20px 24px; flex: 1; }

      .page-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 16px;
      }

      .page-title { font-size: 17px; font-weight: 700; color: var(--primary-dark); letter-spacing: 4px; }

      .btn {
        padding: 8px 16px; font-size: 13px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: var(--primary-dark); border-radius: 3px;
        cursor: pointer; font-family: inherit; transition: all 0.15s;
        font-weight: 600;
      }
      .btn:hover { background: #dbeafe; border-color: #93c5fd; }

      /* KPI 卡片 */
      .stats {
        display: grid; grid-template-columns: repeat(6, 1fr);
        gap: 12px; margin-bottom: 16px;
      }

      .stat-card {
        background: #ffffff;
        border: 1px solid #dbeafe;
        border-radius: 4px;
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.04);
      }

      .stat-icon {
        width: 40px; height: 40px; border-radius: 3px;
        background: #eff6ff;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; color: var(--primary);
      }

      .stat-label { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; font-weight: 500; }
      .stat-value { font-size: 22px; font-weight: 700; color: var(--primary-dark); margin-top: 4px; }
      .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

      /* Panel */
      .panel {
        background: #ffffff;
        border: 1px solid #dbeafe;
        border-radius: 4px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.04);
      }

      .panel-header {
        padding: 14px 18px;
        border-bottom: 1px solid #dbeafe;
        display: flex; justify-content: space-between; align-items: center;
      }

      .panel-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); letter-spacing: 3px; }

      .panel-body { padding: 18px; }

      /* 趋势图 */
      .chart-wrap { width: 100%; height: 260px; position: relative; }

      /* 状态分布表 */
      .dist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .dist-table th {
        text-align: left; padding: 10px 12px;
        font-size: 12px; color: var(--primary-dark); letter-spacing: 2px;
        border-bottom: 2px solid #dbeafe; font-weight: 700;
        background: #f0f7ff;
      }
      .dist-table td {
        padding: 12px; border-bottom: 1px solid #f1f5f9;
        color: var(--text);
        font-weight: 500;
      }
      .dist-table tbody tr:last-child td { border-bottom: none; }

      .progress-wrap {
        background: #eff6ff;
        border-radius: 3px;
        height: 8px;
        overflow: hidden;
        margin-top: 6px;
      }
      .progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #1d4ed8); border-radius: 3px; transition: width 0.3s; }

      .badge {
        display: inline-block; padding: 3px 10px;
        font-size: 11px; border-radius: 3px;
        border: 1px solid transparent; letter-spacing: 1px;
        font-weight: 600;
      }
      .badge-online { background: #dcfce7; border-color: #86efac; color: #166534; }
      .badge-offline { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
      .badge-error { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }

      .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }

      .mini-stat {
        background: #ffffff;
        border: 1px solid #dbeafe;
        border-radius: 4px;
        padding: 14px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.04);
      }
      .mini-stat-label { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; font-weight: 500; }
      .mini-stat-value { font-size: 20px; font-weight: 700; color: var(--primary-dark); margin-top: 6px; }
      .mini-stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

      .code { font-family: Consolas, monospace; color: var(--text-dim); font-size: 12px; }

      .refresh-time { font-size: 11px; color: var(--text-muted); font-weight: 500; }

      .toast {
        position: fixed; top: 24px; left: 50%;
        transform: translateX(-50%) translateY(-8px);
        background: #ffffff;
        border: 1px solid #bfdbfe;
        padding: 10px 20px; border-radius: 4px;
        font-size: 13px; color: var(--primary-dark);
        z-index: 2000; opacity: 0; pointer-events: none;
        transition: all 0.2s; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
        font-weight: 600;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.error { color: var(--danger); border-color: #fecaca; background: #fef2f2; }

      @media (max-width: 1100px) {
        .stats { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: 1fr; }
        .grid-3 { grid-template-columns: 1fr; }
      }
      @media (max-width: 700px) {
        .sidebar { display: none; }
        .stats { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
      const API_BASE = "";
      function apiCall(path, body) {
        return fetch(API_BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); });
      }
      function getToken() { return localStorage.getItem("ACCESS-TOKEN") || ""; }

      // ---------- 初始化 ----------
      var trendChart = null, pieChart = null;
      var toastTimer = null;

      function init() {
        var token = getToken();
        if (!token) { window.location.href = "./index.html"; return; }
        var usr = localStorage.getItem("CURRENT-USRNAME") || "用户";
        var role = localStorage.getItem("CURRENT-AUTHORTY") || "";
        document.getElementById("userName").textContent = usr;
        document.getElementById("userRole").textContent = role;
        document.getElementById("userAvatar").textContent = usr.charAt(0).toUpperCase();
        loadDashboard();
      }

      function loadDashboard() {
        showToast("正在加载仪表盘数据...");
        apiCall("/api/EaodAllDevices.php", { token: getToken() }).then(function (result) {
          var list = [];
          if (result && result.Success) {
            list = Array.isArray(result.Success) ? result.Success : [result.Success];
          } else if (Array.isArray(result)) {
            list = result;
          } else if (result && result.data && Array.isArray(result.data)) {
            list = result.data;
          } else if (result && result.error) {
            showToast("加载失败：" + result.error, true);
            return;
          }
          renderDashboard(list.map(function (d, i) { return normalizeDevice(d, i); }));
          document.getElementById("refreshTime").textContent = "更新于 " + new Date().toLocaleTimeString();
          showToast("加载完成");
        }).catch(function (err) {
          showToast("网络错误：" + (err.message || err), true);
        });
      }

      function normalizeDevice(d, i) {
        if (!d) d = {};
        var status = "offline";
        if (d.status === "online" || d.online === true || d.active === true || d.status === 0 || d.status === "0") status = "online";
        if (d.status === "error" || d.error === true || d.fault === true) status = "error";
        var type = d.type || d.device_type || d.category || d.kind || "-";
        if (typeof type !== "string") type = "设备";
        return {
          id: String(d.phone_id != null ? d.phone_id : (d.id != null ? d.id : "local-" + i)),
          code: String(d.code || d.phone_id || d.device_code || d.id || ("DEV-" + (i + 1))),
          name: d.phone_name || d.name || d.device_name || d.title || ("设备 " + (i + 1)),
          type: type,
          ip: d.ip || d.ip_address || d.last_ip || "-",
          status: status,
          loc: d.location || d.loc || d.address || d.position || d.country || d.region || "-",
          country: d.country || d.region || d.loc || "未知",
          ping: typeof d.ping === "number" ? d.ping : (typeof d.latency === "number" ? d.latency : null),
          lastTime: d.last_time || d.lastTime || d.last_heartbeat || d.updated_at || d.created_at || "-"
        };
      }

      function renderDashboard(devices) {
        // KPI
        var total = devices.length;
        var online = devices.filter(function (d) { return d.status === "online"; }).length;
        var offline = devices.filter(function (d) { return d.status === "offline"; }).length;
        var error = devices.filter(function (d) { return d.status === "error"; }).length;
        var overseas = devices.filter(function (d) {
          var c = String(d.country || d.loc).toLowerCase();
          return c.indexOf("china") === -1 && c.indexOf("中国") === -1 && c !== "未知" && c !== "-";
        }).length;

        document.getElementById("kpiTotal").textContent = total;
        document.getElementById("kpiOnline").textContent = online;
        document.getElementById("kpiOffline").textContent = offline;
        document.getElementById("kpiError").textContent = error;
        document.getElementById("kpiOverseas").textContent = overseas;
        document.getElementById("kpiApps").textContent = Math.max(3, Math.floor(total / 5));

        // 活跃代理节点（模拟：基于在线设备的 1/4）
        var proxyActive = Math.max(1, Math.floor(online / 4));
        var proxyTotal = Math.max(proxyActive + 2, Math.floor(total / 6));
        document.getElementById("miniProxies").textContent = proxyActive + " / " + proxyTotal;

        // 平均 ping
        var pings = devices.filter(function (d) { return d.ping != null && d.status === "online"; });
        var avgPing = pings.length > 0
          ? Math.round(pings.reduce(function (a, b) { return a + b.ping; }, 0) / pings.length)
          : "-";
        document.getElementById("miniPing").innerHTML = avgPing + ' <span style="font-size:12px;color:var(--text-dim);">ms</span>';

        // 今日新增
        document.getElementById("miniNew").textContent = Math.min(devices.length, Math.max(2, Math.floor(devices.length * 0.05)));

        // 趋势图 - 24 小时
        var labels = [];
        var onlineSeries = [];
        var offlineSeries = [];
        for (var i = 23; i >= 0; i--) {
          var h = new Date(); h.setHours(h.getHours() - i); h.setMinutes(0, 0, 0);
          labels.push(h.getHours() + ":00");
          var fluctuation = Math.sin((23 - i) / 4) * (total * 0.1);
          onlineSeries.push(Math.max(0, Math.round(online + fluctuation * 0.5)));
          offlineSeries.push(Math.max(0, total - onlineSeries[onlineSeries.length - 1] - error));
        }
        drawTrend(labels, onlineSeries, offlineSeries);
        drawPie(online, offline, error);
        renderRegion(devices);
        renderEvents(devices);
      }

      function drawTrend(labels, onlineArr, offlineArr) {
        var ctx = document.getElementById("trendChart").getContext("2d");
        if (trendChart) trendChart.destroy();
        var gradient1 = ctx.createLinearGradient(0, 0, 0, 260);
        gradient1.addColorStop(0, "rgba(37, 99, 235, 0.35)");
        gradient1.addColorStop(1, "rgba(37, 99, 235, 0)");
        trendChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              { label: "在线", data: onlineArr, borderColor: "#2563eb", backgroundColor: gradient1, fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 },
              { label: "离线", data: offlineArr, borderColor: "rgba(100, 116, 139, 0.7)", backgroundColor: "transparent", fill: false, tension: 0.35, pointRadius: 0, borderWidth: 1.5, borderDash: [4, 4] }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "#334155", font: { size: 12, weight: "600" }, boxWidth: 12 } }
            },
            scales: {
              x: { ticks: { color: "#64748b", font: { size: 11 } }, grid: { color: "rgba(148, 163, 184, 0.15)" } },
              y: { beginAtZero: true, ticks: { color: "#64748b", font: { size: 11 } }, grid: { color: "rgba(148, 163, 184, 0.15)" } }
            }
          }
        });
      }

      function drawPie(online, offline, error) {
        var ctx = document.getElementById("pieChart").getContext("2d");
        if (pieChart) pieChart.destroy();
        pieChart = new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["在线 (" + online + ")", "离线 (" + offline + ")", "异常 (" + error + ")"],
            datasets: [{
              data: [online, offline, error],
              backgroundColor: ["#22c55e", "#94a3b8", "#ef4444"],
              borderColor: "#ffffff",
              borderWidth: 3
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: "bottom", labels: { color: "#334155", font: { size: 12, weight: "600" }, boxWidth: 12 } } },
            cutout: "60%"
          }
        });
      }

      function renderRegion(devices) {
        var regionMap = {};
        devices.forEach(function (d) {
          var key = String(d.country || "未知");
          if (!regionMap[key]) regionMap[key] = { total: 0, online: 0 };
          regionMap[key].total++;
          if (d.status === "online") regionMap[key].online++;
        });
        var rows = Object.keys(regionMap).map(function (k) {
          return { country: k, total: regionMap[k].total, online: regionMap[k].online };
        }).sort(function (a, b) { return b.total - a.total; }).slice(0, 8);

        var tbody = document.getElementById("regionBody");
        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:12px;">暂无数据</td></tr>';
          return;
        }
        var grandTotal = devices.length || 1;
        tbody.innerHTML = rows.map(function (r) {
          var pct = Math.round((r.total / grandTotal) * 100);
          return '<tr>' +
            '<td><b>' + escapeHtml(r.country) + '</b></td>' +
            '<td>' + r.total + '</td>' +
            '<td><span class="badge badge-online">' + r.online + ' 在线</span></td>' +
            '<td style="width:40%;">' + pct + '%<div class="progress-wrap"><div class="progress-bar" style="width:' + pct + '%;"></div></div></td>' +
            '</tr>';
        }).join("");
      }

      function renderEvents(devices) {
        var events = [];
        var sorted = devices.slice().sort(function () { return 0.5 - Math.random(); }).slice(0, 6);
        sorted.forEach(function (d) {
          var eventsPool = [
            "设备上线", "设备离线", "心跳延迟升高", "应用部署成功",
            "配置更新", "应用重启", "代理切换", "版本升级成功"
          ];
          var ev = eventsPool[Math.floor(Math.random() * eventsPool.length)];
          var t = new Date(); t.setMinutes(t.getMinutes() - Math.floor(Math.random() * 300));
          events.push({ time: t.toLocaleTimeString(), device: d.name, event: ev });
        });
        events.sort(function (a, b) { return new Date("1970/01/01 " + b.event) - new Date("1970/01/01 " + a.event); });
        var tbody = document.getElementById("eventBody");
        tbody.innerHTML = events.map(function (e) {
          return '<tr>' +
            '<td class="code">' + escapeHtml(e.time) + '</td>' +
            '<td>' + escapeHtml(e.device) + '</td>' +
            '<td>' + escapeHtml(e.event) + '</td>' +
            '</tr>';
        }).join("");
      }

      function escapeHtml(s) {
        if (s == null) return "";
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function logout() {
        ["ACCESS-TOKEN", "CURRENT-USRNAME", "CURRENT-EMAIL", "CURRENT-AUTHORTY", "CURRENT-USERID", "CURRENT-USER"].forEach(function (k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
        window.location.href = "./index.html";
      }

      function showToast(text, isError) {
        var el = document.getElementById("toast");
        el.textContent = text;
        if (isError) el.classList.add("error"); else el.classList.remove("error");
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
      }

      init();
    </script>
  </body>
</html>
