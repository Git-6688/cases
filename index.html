<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 诸神黄昏</title>
    <style>
:root {
    --primary: #1677ff;
    --primary-hover: #4096ff;
    --primary-bg: #e6f4ff;
    --success: #52c41a;
    --warning: #faad14;
    --danger: #ff4d4f;
    --text-1: #1d2129;
    --text-2: #4e5969;
    --text-3: #86909c;
    --border: #e5e8ef;
    --bg: #f2f3f5;
    --radius: 8px;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    color: var(--text-1);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
}

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: 0 0;
}

::-webkit-scrollbar-thumb {
    background: #d9d9d9;
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: #bbb;
}

input::-ms-clear,
input::-ms-reveal {
    display: none;
}

a {
    color: var(--primary);
    text-decoration: none;
}

a:hover {
    color: var(--primary-hover);
}

button {
    cursor: pointer;
    font-family: inherit;
}

input {
    font-family: inherit;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.page-title {
    color: var(--text-1);
    font-size: 18px;
    font-weight: 600;
    margin: 0;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 16px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-1);
    transition: all 0.2s;
}

.btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

.btn-primary:hover {
    background: var(--primary-hover);
    color: #fff;
    border-color: var(--primary-hover);
}

.btn-danger {
    background: #fff;
    color: var(--danger);
    border-color: #ffccc7;
}

.btn-danger:hover {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
}

.card {
    background: #fff;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
}

.tag {
    display: inline-block;
    padding: 2px 8px;
    font-size: 12px;
    border-radius: 4px;
    line-height: 1.5;
}

.tag-success {
    background: #f6ffed;
    color: #389e0d;
    border: 1px solid #b7eb8f;
}

.tag-warning {
    background: #fffbe6;
    color: #d48806;
    border: 1px solid #ffe58f;
}

.tag-danger {
    background: #fff1f0;
    color: #cf1322;
    border: 1px solid #ffa39e;
}

.tag-default {
    background: #fafafa;
    color: #595959;
    border: 1px solid #d9d9d9;
}

.tag-info {
    background: #e6f4ff;
    color: #0958d9;
    border: 1px solid #91caff;
}

.login-page {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

.login-page::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #0000006b;
    z-index: 0;
}

.login-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
}

.login-bg-image {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(135deg, #1a0d00 0%, #2d1800 50%, #1a0d00 100%);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: saturate(0.85) contrast(1.08);
}

.login-bg-image::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(20, 10, 0, 0.35) 0%, transparent 30%, rgba(10, 5, 0, 0.55) 100%),
        radial-gradient(ellipse at 30% 40%, rgba(180, 110, 10, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 65%, rgba(100, 50, 0, 0.25) 0%, transparent 60%);
    pointer-events: none;
}

.login-bg-image::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(90, 50, 10, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90, 50, 10, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
}

.login-bg-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
}

.skip-btn {
    z-index: 20;
    position: fixed;
    bottom: 36px;
    right: 44px;
    color: #ffffffbf;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    letter-spacing: 0.5px;
    background: #ffffff1a;
    border: 1px solid #ffffff40;
    border-radius: 20px;
    padding: 5px 18px;
    font-size: 12px;
    transition: all 0.2s;
}

.skip-btn:hover {
    color: #fff;
    background: #fff3;
}

.login-wrap {
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.login-logo-wrap {
    text-align: center;
    margin-bottom: -18px;
    position: relative;
    z-index: 3;
}

.login-logo-img {
    width: 420px;
    height: auto;
    margin: 0 auto;
    display: block;
    filter: drop-shadow(0 6px 20px #000000b3);
}

.login-panel {
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    background: linear-gradient(160deg, #0c0500d1 0%, #1e0c00c7 100%);
    border: 1px solid #b46e0a59;
    border-radius: 2px;
    width: 400px;
    padding: 30px 36px 34px;
    position: relative;
    overflow: hidden;
    box-shadow:
        0 0 0 1px #ff96140f,
        0 24px 64px #000000b3,
        inset 0 1px #ffbe3c1f;
}

.login-panel::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, #0000, #dca01eb3, #0000);
}

.login-panel::after {
    content: "";
    position: absolute;
    top: -1px;
    left: -1px;
    width: 16px;
    height: 16px;
    border-top: 1.5px solid #dca01ecc;
    border-left: 1.5px solid #dca01ecc;
}

.panel-header {
    margin-bottom: 24px;
}

.panel-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.panel-title-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, #0000, #be821480, #0000);
}

.panel-title-text {
    white-space: nowrap;
    font-size: 13px;
    font-weight: 700;
    color: #e6af37eb;
    letter-spacing: 4px;
    text-shadow: 0 0 12px #dc961466;
}

.field-wrap {
    margin-bottom: 16px;
}

.field-input-wrap {
    display: flex;
    align-items: center;
    background: #00000080;
    border: 1px solid #a0640f59;
    border-radius: 3px;
    overflow: hidden;
    transition: border-color 0.22s, box-shadow 0.22s;
}

.field-input-wrap.focused {
    border-color: #dc9619bf;
    box-shadow: 0 0 12px #dc640038, inset 0 0 10px #c864000d;
}

.field-input-wrap.error {
    border-color: #f05050a6;
    box-shadow: 0 0 8px #f03c3c2e;
}

.field-prefix-icon {
    flex-shrink: 0;
    width: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #c8912399;
}

.field-suffix-icon {
    flex-shrink: 0;
    user-select: none;
    transition: color 0.2s;
}

.field-suffix-icon:hover {
    color: #e6af37 !important;
}

.custom-input {
    flex: 1;
    letter-spacing: 0.3px;
    color: #fff0c8f2 !important;
    height: 44px !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 10px !important;
    font-size: 14px !important;
    outline: none !important;
}

.custom-input::placeholder {
    letter-spacing: 0.5px;
    color: #b48c3c66 !important;
    font-size: 13px !important;
}

.field-error {
    color: #ff6e5ae6;
    font-size: 11px;
    margin: 4px 0 0;
}

.fire-btn {
    width: 100%;
    height: 48px;
    margin-top: 10px;
    cursor: pointer;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 1px 8px #000000e6;
    border: none;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 800;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #ff8822 0%, #d44a00 50%, #a83000 100%);
    box-shadow:
        0 4px 22px #b432008c,
        inset 0 1px #ffd2642e;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
}

.fire-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 50%, #ffcc0088 0%, transparent 30%),
        radial-gradient(circle at 80% 50%, #ff440066 0%, transparent 30%);
    animation: fire-glow 2s ease-in-out infinite alternate;
}

.fire-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(#ffffff12 0%, #0000 55%);
}

.fire-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 30px #c83c00b3;
}

.fire-btn:active:not(:disabled) {
    box-shadow: none;
    transform: translateY(1px);
}

.fire-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

@keyframes fire-glow {
    0% {
        opacity: 0.4;
        transform: translateX(-10%);
    }
    100% {
        opacity: 0.8;
        transform: translateX(10%);
    }
}

.panel-footer {
    margin-top: 20px;
    text-align: center;
    color: #b48c3c80;
    font-size: 11px;
    letter-spacing: 1px;
}

.card-enter {
    animation: card-enter 1s cubic-bezier(0.22, 0.61, 0.36, 1) ease;
}

@keyframes card-enter {
    from {
        opacity: 0;
        transform: translateY(28px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 520px) {
    .login-panel {
        width: 320px;
        padding: 24px 28px;
    }
    .login-logo-img {
        width: 280px;
    }
    .skip-btn {
        right: 20px;
        bottom: 20px;
    }
}
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-bg">
            <div class="login-bg-image"></div>
            <div class="login-bg-overlay"></div>
        </div>

        <button class="skip-btn" onclick="skipLogin()">跳过 ›</button>

        <div class="login-wrap card-enter">
            <div class="login-logo-wrap">
                <svg class="login-logo-img" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#8b5a00" stop-opacity="0.6"/>
                            <stop offset="50%" stop-color="#e6af37" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#8b5a00" stop-opacity="0.6"/>
                        </linearGradient>
                        <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffd88c"/>
                            <stop offset="50%" stop-color="#e6af37"/>
                            <stop offset="100%" stop-color="#b88014"/>
                        </linearGradient>
                    </defs>
                    <text x="150" y="55" text-anchor="middle" font-family="serif" font-size="48" font-weight="900"
                          fill="url(#textGrad)" letter-spacing="8"
                          style="text-shadow: 0 0 20px #dc961466, 0 4px 12px #000;">诸 神 黄 昏</text>
                    <line x1="30" y1="70" x2="270" y2="70" stroke="url(#goldGrad)" stroke-width="1"/>
                </svg>
            </div>

            <div class="login-panel">
                <div class="panel-header">
                    <div class="panel-title-row">
                        <div class="panel-title-line"></div>
                        <div class="panel-title-text">账 号 登 录</div>
                        <div class="panel-title-line"></div>
                    </div>
                </div>

                <form class="login-form" onsubmit="handleLogin(event)">
                    <div class="field-wrap">
                        <div class="field-input-wrap" id="usernameWrap">
                            <div class="field-prefix-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <input type="text" class="custom-input" id="username" name="username" placeholder="请输入用户名"
                                   onfocus="wrapFocus('usernameWrap', true)" onblur="wrapFocus('usernameWrap', false)">
                        </div>
                    </div>

                    <div class="field-wrap">
                        <div class="field-input-wrap" id="passwordWrap">
                            <div class="field-prefix-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </div>
                            <input type="password" class="custom-input" id="password" name="password" placeholder="请输入密码"
                                   onfocus="wrapFocus('passwordWrap', true)" onblur="wrapFocus('passwordWrap', false)"
                                   onkeydown="handlePwdKey(event)">
                            <div class="field-suffix-icon" onclick="togglePassword()" style="cursor:pointer;color:#c896328c;padding-right:12px;">
                                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="fire-btn" id="loginBtn">登 录</button>
                </form>

                <div class="panel-footer">
                    <span>© 诸神黄昏 · 设备管理系统</span>
                </div>
            </div>
        </div>
    </div>

    <script>
// ⚙️ API 基地址。部署后如果 API 在同源服务器，保持 "" 即可。
// 如果 API 在别的域名（例如 https://1jiangjun.com），请改成该域名。
const API_BASE = "";

function apiCall(path, body) {
    return fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    }).then(r => r.json());
}

function wrapFocus(id, focused) {
    const el = document.getElementById(id);
    if (el) {
        if (focused) el.classList.add("focused");
        else el.classList.remove("focused");
    }
}

function togglePassword() {
    const input = document.getElementById("password");
    if (!input) return;
    input.type = input.type === "password" ? "text" : "password";
}

function skipLogin() {
    window.location.href = "./devices.html";
}

function showFieldError(wrapId) {
    const wrap = document.getElementById(wrapId);
    wrap.classList.add("error");
    setTimeout(() => wrap.classList.remove("error"), 2200);
}

function showTip(msg) {
    let tip = document.getElementById("loginTip");
    if (!tip) {
        tip = document.createElement("div");
        tip.id = "loginTip";
        tip.style.cssText = "color:#ff6e5ae6;font-size:12px;text-align:center;margin-top:10px;letter-spacing:1px;";
        document.querySelector(".login-form").appendChild(tip);
    }
    tip.textContent = msg;
    clearTimeout(tip._t);
    tip._t = setTimeout(() => (tip.textContent = ""), 2800);
}

async function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const usernameWrap = document.getElementById("usernameWrap");
    const passwordWrap = document.getElementById("passwordWrap");

    usernameWrap.classList.remove("error");
    passwordWrap.classList.remove("error");

    if (!username) { showFieldError("usernameWrap"); return; }
    if (!password) { showFieldError("passwordWrap"); return; }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "登 录 中...";

    try {
        const result = await apiCall("/api/EaodLogin.php", {
            action: "pre_login",
            usrname: username,
            password: password
        });

        // 成功: { Success: { token, usrname, email, authorty, userid } }
        // 失败: { error: "..." }
        // 2FA:  { step: "2fa", session_id, bot_link }
        if (result && result.Success) {
            const u = result.Success;
            localStorage.setItem("ACCESS-TOKEN", u.token || "");
            localStorage.setItem("CURRENT-USRNAME", u.usrname || username);
            localStorage.setItem("CURRENT-EMAIL", u.email || "");
            localStorage.setItem("CURRENT-AUTHORTY", u.authorty || "");
            localStorage.setItem("CURRENT-USERID", u.userid || "");
            window.location.href = "./devices.html";
        } else if (result && result.error) {
            showFieldError("usernameWrap");
            showFieldError("passwordWrap");
            showTip(String(result.error));
            btn.disabled = false;
            btn.textContent = "登 录";
        } else if (result && result.step === "2fa") {
            showTip("该账号需要二次验证，请在原系统完成");
            btn.disabled = false;
            btn.textContent = "登 录";
        } else {
            showFieldError("usernameWrap");
            showFieldError("passwordWrap");
            showTip("登录失败，请重试");
            btn.disabled = false;
            btn.textContent = "登 录";
        }
    } catch (err) {
        showTip("网络错误：" + (err.message || err));
        btn.disabled = false;
        btn.textContent = "登 录";
    }
}

function handlePwdKey(event) {
    if (event.key === "Enter") {
        handleLogin(event);
    }
}
    </script>
</body>
</html>
