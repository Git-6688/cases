<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诸神黄昏</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-light: #4f83f5;
        --primary-dark: #1d4ed8;
        --gold: #d97706;
        --gold-light: #f59e0b;
        --gold-dark: #b45309;
        --bg-1: #f0f7ff;
        --bg-2: #e0ecf8;
        --text: #0f172a;
        --text-dim: #334155;
        --text-muted: #64748b;
        --danger: #dc2626;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 100%; min-height: 100vh; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(180deg, #f0f7ff 0%, #e0ecf8 50%, #d0e4f5 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-wrap {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .brand {
        margin-bottom: 40px;
      }

      .brand-title {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 12px;
        background: linear-gradient(180deg, #ffd88c 0%, #d97706 50%, #92400e 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 4px 20px rgba(217, 119, 6, 0.2);
        padding-left: 12px;
      }

      .brand-sub {
        margin-top: 10px;
        font-size: 13px;
        color: var(--primary-dark);
        letter-spacing: 6px;
        font-weight: 500;
      }

      .brand-divider {
        width: 80px;
        height: 2px;
        margin: 24px auto 0;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .card {
        background: #ffffff;
        border: 1px solid #dbeafe;
        border-radius: 4px;
        padding: 36px 32px;
        box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12), 0 2px 8px rgba(37, 99, 235, 0.06);
      }

      .card-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary-dark);
        letter-spacing: 8px;
        margin-bottom: 32px;
      }

      .field {
        margin-bottom: 16px;
        text-align: left;
      }

      .field-label {
        display: block;
        font-size: 12px;
        color: var(--primary-dark);
        margin-bottom: 8px;
        letter-spacing: 3px;
        font-weight: 600;
      }

      .field-input {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 3px;
        color: var(--text);
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      }

      .field-input:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      .field-input::placeholder {
        color: #94a3b8;
      }

      .btn-login {
        width: 100%;
        margin-top: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 8px;
        color: #ffffff;
        background: linear-gradient(180deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
        border: 1px solid #2563eb;
        border-radius: 3px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.1s, box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      }

      .btn-login:hover:not(:disabled) {
        box-shadow: 0 6px 24px rgba(37, 99, 235, 0.45);
      }

      .btn-login:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        margin-top: 16px;
        padding: 10px;
        font-size: 12px;
        border-radius: 2px;
        display: none;
      }

      .message.show { display: block; }
      .message.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
      .message.loading { background: #eff6ff; color: var(--primary-dark); border: 1px solid #bfdbfe; }

      .footer {
        margin-top: 28px;
        font-size: 12px;
        color: var(--primary-dark);
        letter-spacing: 2px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="brand">
        <div class="brand-title">诸神黄昏</div>
        <div class="brand-divider"></div>
        <div class="brand-sub">设 备 管 理 系 统</div>
      </div>

      <div class="card">
        <div class="card-title">账 号 登 录</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="field">
            <label class="field-label">用户名</label>
            <input type="text" class="field-input" id="username" name="username" placeholder="请输入用户名" autofocus />
          </div>

          <div class="field">
            <label class="field-label">密码</label>
            <input type="password" class="field-input" id="password" name="password" placeholder="请输入密码" />
          </div>

          <button type="submit" class="btn-login" id="btnLogin">登 录</button>

          <div class="message" id="msg">登录中...</div>
        </form>
      </div>

      <div class="footer">© 诸神黄昏 · 设备管理系统</div>
    </div>

    <script>
      // ⚙️ 如果你把页面放到和 API 不同的域名，请改成 API 域名，例如：
      // const API_BASE = "https://1jiangjun.com";
      const API_BASE = "";

      function apiCall(path, body) {
        return fetch(API_BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); });
      }

      function showMsg(text, type) {
        var el = document.getElementById("msg");
        el.className = "message show " + (type || "");
        el.textContent = text;
        if (type !== "loading") {
          setTimeout(function () { el.className = "message"; }, 3500);
        }
      }

      function handleLogin(event) {
        event.preventDefault();
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value.trim();
        var btn = document.getElementById("btnLogin");

        if (!username || !password) {
          showMsg("请输入用户名和密码", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "登 录 中...";
        showMsg("正在验证身份...", "loading");

        apiCall("/api/EaodLogin.php", {
          action: "pre_login",
          usrname: username,
          password: password
        }).then(function (result) {
          if (result && result.Success) {
            var u = result.Success;
            localStorage.setItem("ACCESS-TOKEN", u.token || "");
            localStorage.setItem("CURRENT-USRNAME", u.usrname || username);
            localStorage.setItem("CURRENT-EMAIL", u.email || "");
            localStorage.setItem("CURRENT-AUTHORTY", u.authorty || "");
            localStorage.setItem("CURRENT-USERID", u.userid || "");
            showMsg("登录成功，正在跳转...", "loading");
            setTimeout(function () {
              window.location.href = "./devices.html";
            }, 400);
          } else if (result && result.error) {
            showMsg(String(result.error), "error");
            btn.disabled = false;
            btn.textContent = "登 录";
          } else if (result && result.step === "2fa") {
            showMsg("该账号需要二次验证", "error");
            btn.disabled = false;
            btn.textContent = "登 录";
          } else {
            showMsg("登录失败，请重试", "error");
            btn.disabled = false;
            btn.textContent = "登 录";
          }
        }).catch(function (err) {
          showMsg("网络错误：" + (err.message || err), "error");
          btn.disabled = false;
          btn.textContent = "登 录";
        });
      }
    </script>
  </body>
</html>
