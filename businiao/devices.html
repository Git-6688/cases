<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理 · 不死鸟</title>
    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="./styles/devices.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23dc2626'/><circle cx='50' cy='50' r='18' fill='%23000'/></svg>">
</head>
<body>
    <div class="app-layout">

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="title">不死鸟</div>
                <div class="subtitle">DEVICE MGMT</div>
            </div>

            <nav class="menu">
                <div class="menu-group">设备中心</div>
                <a class="menu-item active" href="./devices.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="12" rx="2"/>
                        <line x1="8" y1="20" x2="16" y2="20"/>
                        <line x1="12" y1="16" x2="12" y2="20"/>
                    </svg>
                    <span>设备管理</span>
                </a>
                <a class="menu-item" href="#" onclick="showToast('功能开发中...', 'warn'); return false;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>系统设置</span>
                </a>
            </nav>

            <div class="sidebar-footer">© 不死鸟 · v1.0.0</div>
        </aside>

        <!-- 主体 -->
        <main class="main-content">

            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="breadcrumb">
                    <span>首页</span>
                    <span class="sep">/</span>
                    <span class="current">设备管理</span>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">管</div>
                        <div>
                            <div class="user-name" id="userName">admin</div>
                            <div class="user-role">超级管理员</div>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="logout()">退出登录</button>
                </div>
            </header>

            <!-- 内容区 -->
            <div class="page-content">

                <!-- 欢迎横幅 -->
                <div class="welcome-bar">
                    <div class="welcome-left">
                        <div class="welcome-title">🔥 欢迎回来，<span id="welcomeUser">admin</span></div>
                        <div class="welcome-sub">当前时间：<span id="welcomeTime"></span> · 宇智波秘传 · 设备监控系统</div>
                    </div>
                    <div class="welcome-right">
                        <div class="welcome-stat">
                            <div class="num" id="wTotal">0</div>
                            <div class="label">设备总数</div>
                        </div>
                        <div class="welcome-stat">
                            <div class="num" style="color:#bbf7d0;" id="wOnline">0</div>
                            <div class="label">在线</div>
                        </div>
                        <div class="welcome-stat">
                            <div class="num" style="color:#fecaca;" id="wError">0</div>
                            <div class="label">异常</div>
                        </div>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="stats-row">
                    <div class="stat-card" style="--stat-color:#dc2626;">
                        <div class="stat-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="12" rx="2"/>
                                <line x1="8" y1="20" x2="16" y2="20"/>
                                <line x1="12" y1="16" x2="12" y2="20"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">设备总数</div>
                            <div class="stat-value" id="stTotal">0</div>
                            <div class="stat-trend" id="stTotalTrend"></div>
                        </div>
                    </div>
                    <div class="stat-card" style="--stat-color:#16a34a;">
                        <div class="stat-icon" data-type="online">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">在线设备</div>
                            <div class="stat-value" style="color:#15803d;" id="stOnline">0</div>
                            <div class="stat-trend" id="stOnlineTrend"></div>
                        </div>
                    </div>
                    <div class="stat-card" style="--stat-color:#6b7280;">
                        <div class="stat-icon" data-type="offline">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">离线设备</div>
                            <div class="stat-value" style="color:#4b5563;" id="stOffline">0</div>
                            <div class="stat-trend" style="color:#6b7280;" id="stOfflineTrend"></div>
                        </div>
                    </div>
                    <div class="stat-card" style="--stat-color:#dc2626;">
                        <div class="stat-icon" data-type="error">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                <line x1="12" y1="9" x2="12" y2="13"/>
                                <line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">异常设备</div>
                            <div class="stat-value" style="color:#b91c1c;" id="stError">0</div>
                            <div class="stat-trend" style="color:#b91c1c;" id="stErrorTrend"></div>
                        </div>
                    </div>
                </div>

                <!-- 工具栏 -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text" id="searchInput" placeholder="搜索设备名称 / 编号 / IP / 位置...">
                        </div>
                        <select class="filter-select" id="statusFilter">
                            <option value="">全部状态</option>
                            <option value="online">在线</option>
                            <option value="offline">离线</option>
                            <option value="error">异常</option>
                        </select>
                        <select class="filter-select" id="typeFilter">
                            <option value="">全部类型</option>
                            <option value="终端">终端</option>
                            <option value="服务器">服务器</option>
                            <option value="路由器">路由器</option>
                            <option value="摄像头">摄像头</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn" onclick="refreshList()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"/>
                                <polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                            刷新
                        </button>
                        <button class="btn btn-gold" onclick="exportCSV()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            导出 CSV
                        </button>
                        <button class="btn" id="batchDelBtn" onclick="batchDelete()" style="display:none;">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            </svg>
                            批量删除
                        </button>
                        <button class="btn btn-primary" onclick="openAddModal()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            添加设备
                        </button>
                    </div>
                </div>

                <!-- 表格 -->
                <div class="table-card">
                    <div class="table-header">
                        <div class="table-title">
                            设备列表（共 <span class="count" id="totalCount">0</span> 台）
                        </div>
                        <div class="table-meta" id="tableMeta"></div>
                    </div>

                    <div class="table-wrap">
                        <table class="device-table">
                            <thead>
                                <tr>
                                    <th style="width:48px; text-align:center;">
                                        <div class="checkbox-wrap">
                                            <input type="checkbox" id="checkAll" onchange="toggleAll(this)">
                                        </div>
                                    </th>
                                    <th style="width:70px;">#</th>
                                    <th>设备编号</th>
                                    <th>设备名称</th>
                                    <th>类型</th>
                                    <th>IP 地址</th>
                                    <th>位置</th>
                                    <th>状态</th>
                                    <th>最后心跳</th>
                                    <th style="width:220px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="deviceTableBody"></tbody>
                        </table>
                    </div>

                    <!-- 分页 -->
                    <div class="pagination">
                        <div class="pagination-info">
                            显示第 <b id="pgStart">0</b> - <b id="pgEnd">0</b> 条 / 共 <b id="pgTotal">0</b> 条
                        </div>
                        <div class="pagination-controls">
                            <select class="page-size" id="pageSize" onchange="changePageSize()">
                                <option value="10">10 条/页</option>
                                <option value="20" selected>20 条/页</option>
                                <option value="50">50 条/页</option>
                                <option value="100">100 条/页</option>
                            </select>
                            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">‹ 上一页</button>
                            <span id="pageNumbers" style="display:flex; gap:4px;"></span>
                            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页 ›</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 添加/编辑 设备 Modal -->
    <div class="modal" id="deviceModal">
        <div class="modal-mask" onclick="closeModal()"></div>
        <div class="modal-dialog" style="width:560px; max-width:calc(100% - 40px);">
            <div class="modal-header">
                <span id="modalTitle">添加设备</span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="deviceForm" onsubmit="saveDevice(event)">
                    <div class="form-row">
                        <label>设备编号 <span class="req">*</span></label>
                        <input type="text" class="form-input" id="fCode" placeholder="如 DEV-001" required>
                    </div>
                    <div class="form-row">
                        <label>设备名称 <span class="req">*</span></label>
                        <input type="text" class="form-input" id="fName" placeholder="请输入设备名称" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-row">
                            <label>类型</label>
                            <select class="form-select" id="fType">
                                <option value="终端">终端</option>
                                <option value="服务器">服务器</option>
                                <option value="路由器">路由器</option>
                                <option value="摄像头">摄像头</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>状态</label>
                            <select class="form-select" id="fStatus">
                                <option value="online">在线</option>
                                <option value="offline">离线</option>
                                <option value="error">异常</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-row">
                            <label>IP 地址</label>
                            <input type="text" class="form-input" id="fIp" placeholder="192.168.1.1">
                        </div>
                        <div class="form-row">
                            <label>位置</label>
                            <input type="text" class="form-input" id="fLoc" placeholder="如 机房A-3号柜">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>备注</label>
                        <textarea class="form-textarea" id="fNote" placeholder="可选的设备备注信息..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="document.getElementById('deviceForm').requestSubmit()">确认保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="./scripts/devices.js"></script>
</body>
</html>
