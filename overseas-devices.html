<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诸神黄昏 · 海外设备</title>
    <style>
      :root {
        --gold: #dca01e;
        --gold-light: #e6b83a;
        --gold-dark: #8b5a00;
        --bg-1: #0a0604;
        --bg-2: #1a0d00;
        --bg-panel: rgba(12, 8, 2, 0.75);
        --text: #f2e6c8;
        --text-dim: #a89462;
        --text-muted: #7a6a40;
        --border: rgba(220, 160, 30, 0.2);
        --border-strong: rgba(220, 160, 30, 0.35);
        --success: #4caf50;
        --warning: #ff9800;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color: var(--text);
        font-size: 14px; line-height: 1.6;
      }
      .layout { min-height: 100vh; display: flex; }

      /* 侧边栏 */
      .sidebar {
        width: 220px; background: rgba(8, 5, 2, 0.8);
        border-right: 1px solid var(--border);
        display: flex; flex-direction: column; flex-shrink: 0;
      }
      .sidebar-logo { padding: 24px 20px; text-align: center; border-bottom: 1px solid var(--border); }
      .sidebar-logo-title {
        font-size: 22px; font-weight: 900; letter-spacing: 6px;
        background: linear-gradient(180deg, #ffd88c 0%, #dca01e 60%, #8b5a00 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sidebar-logo-sub { margin-top: 6px; font-size: 10px; color: var(--text-dim); letter-spacing: 4px; }
      .sidebar-menu { flex: 1; padding: 16px 12px; }
      .menu-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; margin-bottom: 4px; border-radius: 2px;
        color: var(--text-dim); cursor: pointer; font-size: 13px;
        transition: background 0.15s, color 0.15s; user-select: none;
      }
      .menu-item:hover { background: rgba(220,160,30,0.08); color: var(--gold-light); }
      .menu-item.active {
        background: rgba(220,160,30,0.12); color: var(--gold-light);
        border-left: 2px solid var(--gold); padding-left: 12px;
      }
      .menu-item .icon { width: 16px; height: 16px; flex-shrink: 0; }
      .sidebar-footer {
        padding: 16px; font-size: 11px; color: var(--text-muted);
        text-align: center; border-top: 1px solid var(--border); letter-spacing: 2px;
      }

      /* 主区域 */
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar {
        background: rgba(12, 8, 2, 0.6); border-bottom: 1px solid var(--border);
        padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
      }
      .breadcrumb { color: var(--text-dim); font-size: 13px; }
      .breadcrumb .sep { margin: 0 8px; color: var(--text-muted); }
      .breadcrumb .current { color: var(--text); font-weight: 500; }
      .user-info { display: flex; align-items: center; gap: 12px; }
      .user-avatar {
        width: 34px; height: 34px; border-radius: 2px;
        background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
        color: #1a0d00; font-weight: 700;
        display: flex; align-items: center; justify-content: center; font-size: 13px;
      }
      .user-detail { text-align: right; }
      .user-name { font-size: 13px; color: var(--text); }
      .user-role { font-size: 11px; color: var(--text-dim); }
      .logout-btn {
        margin-left: 12px; padding: 6px 14px; font-size: 12px;
        background: transparent; border: 1px solid var(--border);
        color: var(--text-dim); border-radius: 2px;
        cursor: pointer; font-family: inherit; transition: all 0.15s;
      }
      .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

      .content { padding: 20px 24px; flex: 1; }
      .page-header {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
      }
      .page-title { font-size: 17px; font-weight: 700; color: var(--gold-light); letter-spacing: 4px; }
      .btn {
        padding: 8px 16px; font-size: 13px;
        background: rgba(220,160,30,0.1);
        border: 1px solid var(--border-strong);
        color: var(--gold-light); border-radius: 2px;
        cursor: pointer; font-family: inherit; transition: all 0.15s;
      }
      .btn:hover { background: rgba(220,160,30,0.2); }
      .btn-primary { background: rgba(220,160,30,0.25); }
      .btn.danger { border-color: rgba(239,68,68,0.35); color: var(--danger); }
      .btn.danger:hover { background: rgba(239,68,68,0.1); }

      /* 统计卡片 */
      .stats {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 12px; margin-bottom: 16px;
      }
      .stat-card {
        background: var(--bg-panel); border: 1px solid var(--border);
        border-radius: 2px; padding: 16px; display: flex; align-items: center; gap: 14px;
      }
      .stat-icon {
        width: 40px; height: 40px; border-radius: 2px;
        background: rgba(220,160,30,0.1);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; color: var(--gold);
      }
      .stat-label { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; }
      .stat-value { font-size: 24px; font-weight: 700; color: var(--gold-light); margin-top: 4px; }

      /* 过滤栏 */
      .filter-bar {
        background: var(--bg-panel); border: 1px solid var(--border);
        border-radius: 2px; padding: 14px; margin-bottom: 12px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      }
      .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
      .filter-input, .filter-select {
        padding: 7px 12px; font-size: 13px;
        background: rgba(0,0,0,0.3); border: 1px solid var(--border);
        border-radius: 2px; color: var(--text); font-family: inherit;
        outline: none; min-width: 180px;
      }
      .filter-select { min-width: 140px; cursor: pointer; }
      .filter-input:focus, .filter-select:focus { border-color: var(--gold); }
      .filter-count { font-size: 12px; color: var(--text-dim); }
      .filter-count b { color: var(--gold-light); font-weight: 700; }

      /* 表格 */
      .table-wrap {
        background: var(--bg-panel); border: 1px solid var(--border);
        border-radius: 2px; overflow-x: auto;
      }
      .device-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .device-table thead { background: rgba(220,160,30,0.08); }
      .device-table th {
        padding: 12px 14px; text-align: left;
        color: var(--gold-light); font-weight: 600; font-size: 12px;
        letter-spacing: 2px; border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .device-table td {
        padding: 12px 14px; border-bottom: 1px solid rgba(220,160,30,0.08);
        color: var(--text);
      }
      .device-table tbody tr:hover { background: rgba(220,160,30,0.05); }
      .device-table tbody tr:last-child td { border-bottom: none; }

      .code { font-family: Consolas, monospace; color: var(--text-dim); font-size: 12px; }

      .badge {
        display: inline-block; padding: 3px 10px; font-size: 11px;
        border-radius: 2px; border: 1px solid var(--border); letter-spacing: 1px;
      }
      .badge-online { background: rgba(76,175,80,0.15); border-color: rgba(76,175,80,0.35); color: #8bc88d; }
      .badge-offline { background: rgba(158,158,158,0.1); border-color: rgba(158,158,158,0.3); color: #a89878; }
      .badge-error { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #f08080; }

      .ping-good { color: #8bc88d; font-weight: 600; }
      .ping-mid { color: var(--gold-light); font-weight: 600; }
      .ping-bad { color: var(--danger); font-weight: 600; }

      .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .row-btn {
        padding: 4px 10px; font-size: 12px; background: transparent;
        border: 1px solid var(--border); color: var(--text-dim);
        border-radius: 2px; cursor: pointer; font-family: inherit; transition: all 0.15s;
      }
      .row-btn:hover { border-color: var(--gold); color: var(--gold-light); }

      /* 分页 */
      .pagination {
        display: flex; justify-content: flex-end; align-items: center; gap: 10px;
        padding: 14px 16px; font-size: 12px; color: var(--text-dim);
        border-top: 1px solid var(--border);
      }
      .page-btn {
        padding: 5px 12px; background: transparent; border: 1px solid var(--border);
        color: var(--text-dim); border-radius: 2px;
        cursor: pointer; font-family: inherit; font-size: 12px; transition: all 0.15s;
      }
      .page-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-light); }
      .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      /* Toast */
      .toast {
        position: fixed; top: 24px; left: 50%;
        transform: translateX(-50%) translateY(-8px);
        background: var(--bg-panel); border: 1px solid var(--border-strong);
        padding: 10px 20px; border-radius: 2px; font-size: 13px;
        color: var(--gold-light); z-index: 2000; opacity: 0;
        pointer-events: none; transition: all 0.2s;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.error { color: var(--danger); border-color: rgba(239,68,68,0.4); }

      /* Modal */
      .modal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6);
        display: none; align-items: center; justify-content: center; z-index: 1500;
      }
      .modal.show { display: flex; }
      .modal-dialog {
        background: var(--bg-panel); border: 1px solid var(--border-strong);
        border-radius: 2px; width: 480px; max-width: calc(100% - 32px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      }
      .modal-header {
        padding: 14px 18px; border-bottom: 1px solid var(--border);
        display: flex; justify-content: space-between; align-items: center;
      }
      .modal-title { font-size: 14px; font-weight: 600; color: var(--gold-light); letter-spacing: 4px; }
      .modal-close {
        background: none; border: none; color: var(--text-dim);
        font-size: 20px; cursor: pointer; line-height: 1; padding: 0;
      }
      .modal-close:hover { color: var(--text); }
      .modal-body { padding: 20px 18px; }
      .modal-footer {
        padding: 12px 18px; border-top: 1px solid var(--border);
        display: flex; justify-content: flex-end; gap: 10px;
      }
      .form-row { margin-bottom: 14px; }
      .form-row:last-child { margin-bottom: 0; }
      .form-row label {
        display: block; font-size: 12px; color: var(--text-dim);
        margin-bottom: 6px; letter-spacing: 2px;
      }
      .form-input {
        width: 100%; padding: 8px 12px; font-size: 13px;
        background: rgba(0,0,0,0.3); border: 1px solid var(--border);
        border-radius: 2px; color: var(--text); font-family: inherit; outline: none;
      }
      .form-input:focus { border-color: var(--gold); }

      .state-row {
        padding: 10px 16px; font-size: 12px; color: var(--text-dim);
        text-align: center; border-top: 1px solid var(--border);
        background: rgba(220,160,30,0.03);
      }
      .state-row.loading { color: var(--gold-light); }
      .state-row.error { color: var(--danger); }

      @media (max-width: 900px) {
        .sidebar { display: none; }
        .stats { grid-template-columns: repeat(2, 1fr); }
        .filter-input { min-width: 140px; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-title">诸神黄昏</div>
          <div class="sidebar-logo-sub">设 备 管 理</div>
        </div>
        <nav class="sidebar-menu">
          <div class="menu-item" onclick="location.href='./dashboard.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>仪表盘</span>
          </div>
          <div class="menu-item" onclick="location.href='./devices.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            <span>设备管理</span>
          </div>
          <div class="menu-item active">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span>海外设备</span>
          </div>
          <div class="menu-item" onclick="location.href='./proxy-management.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            <span>代理管理</span>
          </div>
          <div class="menu-item" onclick="location.href='./apps-list.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>应用列表</span>
          </div>
          <div class="menu-item" onclick="location.href='./app-build.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span>应用构建</span>
          </div>
        </nav>
        <div class="sidebar-footer">© 诸神黄昏</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="breadcrumb">
            <span>首页</span><span class="sep">/</span><span class="current">海外设备</span>
          </div>
          <div class="user-info">
            <div class="user-detail">
              <div class="user-name" id="userName">用户</div>
              <div class="user-role" id="userRole"></div>
            </div>
            <div class="user-avatar" id="userAvatar">U</div>
            <button class="logout-btn" onclick="logout()">退出</button>
          </div>
        </header>

        <div class="content">
          <div class="page-header">
            <div class="page-title">海 外 设 备 列 表</div>
            <button class="btn" onclick="loadDevices()">刷 新</button>
          </div>

          <div class="stats">
            <div class="stat-card">
              <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></div>
              <div><div class="stat-label">总 节 点</div><div class="stat-value" id="kpiTotal">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="color:#8bc88d;background:rgba(76,175,80,0.1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
              <div><div class="stat-label">在 线</div><div class="stat-value" id="kpiOnline" style="color:#8bc88d;">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="color:#a89878;background:rgba(158,158,158,0.1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="6" x2="12" y2="18"></line></svg></div>
              <div><div class="stat-label">离 线</div><div class="stat-value" id="kpiOffline" style="color:#c89878;">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="color:#4fc3f7;background:rgba(79,195,247,0.1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3 3 0 1 0 6 0 3 3 0 0 0-6 0z"></path><circle cx="12" cy="12" r="10"></circle></svg></div>
              <div><div class="stat-label">平 均 延 迟</div><div class="stat-value" id="kpiPing" style="color:#4fc3f7;">0ms</div></div>
            </div>
          </div>

          <div class="filter-bar">
            <div class="filter-group">
              <input type="text" class="filter-input" id="searchInput" placeholder="搜索设备名 / 编号 / IP" oninput="renderTable()" />
              <select class="filter-select" id="countryFilter" onchange="renderTable()">
                <option value="">全部国家</option>
              </select>
              <select class="filter-select" id="statusFilter" onchange="renderTable()">
                <option value="">全部状态</option>
                <option value="online">在线</option>
                <option value="offline">离线</option>
                <option value="error">异常</option>
              </select>
            </div>
            <div class="filter-count">共 <b id="totalCount">0</b> 台海外设备</div>
          </div>

          <div class="table-wrap">
            <table class="device-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>设备编号</th>
                  <th>设备名称</th>
                  <th>国家 / 地区</th>
                  <th>城市</th>
                  <th>IP 地址</th>
                  <th>延迟</th>
                  <th>代理节点</th>
                  <th>状态</th>
                  <th>最后心跳</th>
                  <th style="text-align:right;">操作</th>
                </tr>
              </thead>
              <tbody id="deviceTableBody"></tbody>
            </table>
            <div class="state-row" id="stateRow"></div>
            <div class="pagination">
              <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
              <span>第 <b id="currentPage">1</b> / <span id="totalPages">1</span> 页</span>
              <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
              <select class="filter-select" id="pageSize" onchange="changePage(0)" style="min-width:90px;">
                <option value="10">10 条</option>
                <option value="20" selected>20 条</option>
                <option value="50">50 条</option>
                <option value="9999">全部</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 切换代理 Modal -->
    <div class="modal" id="proxyModal">
      <div class="modal-dialog">
        <div class="modal-header">
          <span class="modal-title">切 换 代 理 节 点</span>
          <button class="modal-close" onclick="closeModal('proxyModal')">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <label>设备</label>
            <div style="color:var(--gold-light); font-weight:600;" id="devName">-</div>
          </div>
          <div class="form-row">
            <label>选择代理节点</label>
            <select class="form-input" id="proxySelect"></select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('proxyModal')">取消</button>
          <button class="btn btn-primary" onclick="confirmProxySwitch()">确 认 切 换</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const API_BASE = "";
      function apiCall(path, body) {
        return fetch(API_BASE + path, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); });
      }
      function getToken() { return localStorage.getItem("ACCESS-TOKEN") || ""; }

      var devices = [];
      var currentPage = 1;
      var switchingId = null;
      var toastTimer = null;
      var proxyPool = [
        "US-EAST-PROXY-01", "US-WEST-PROXY-02", "JP-TOKYO-PROXY-01",
        "SG-SINGAPORE-PROXY-01", "DE-FRANKFURT-PROXY-03", "UK-LONDON-PROXY-02",
        "HK-HONGKONG-PROXY-01", "KR-SEOUL-PROXY-02", "AU-SYDNEY-PROXY-01"
      ];

      function init() {
        var token = getToken();
        if (!token) { window.location.href = "./index.html"; return; }
        var usr = localStorage.getItem("CURRENT-USRNAME") || "用户";
        var role = localStorage.getItem("CURRENT-AUTHORTY") || "";
        document.getElementById("userName").textContent = usr;
        document.getElementById("userRole").textContent = role;
        document.getElementById("userAvatar").textContent = usr.charAt(0).toUpperCase();
        loadDevices();
      }

      function loadDevices() {
        var state = document.getElementById("stateRow");
        state.className = "state-row loading";
        state.textContent = "正在加载海外设备列表...";

        apiCall("/api/EaodAllDevices.php", { token: getToken() }).then(function (result) {
          var list = [];
          if (result && result.Success) {
            list = Array.isArray(result.Success) ? result.Success : [result.Success];
          } else if (Array.isArray(result)) {
            list = result;
          } else if (result && result.data && Array.isArray(result.data)) {
            list = result.data;
          } else if (result && result.error) {
            state.className = "state-row error"; state.textContent = "加载失败：" + result.error;
            showToast("加载失败：" + result.error, true); return;
          }

          // 筛选海外设备（非中国大陆）
          var all = list.map(function (d, i) { return normalizeDevice(d, i); });
          devices = all.filter(function (d) {
            var c = String(d.country || d.loc || "").toLowerCase();
            return c.indexOf("china") === -1
              && c.indexOf("中国") === -1
              && c.indexOf("cn") === -1;
          });

          if (devices.length === 0 && all.length > 0) {
            // 接口未区分国家时，使用模拟数据保证页面可用
            devices = all.map(function (d) {
              return enrichOverseas(d);
            });
          }

          state.textContent = "已加载 " + devices.length + " 台海外设备 · 更新于 " + new Date().toLocaleTimeString();
          state.className = "state-row";

          // 填充国家筛选
          var countrySet = {};
          devices.forEach(function (d) { countrySet[d.country] = true; });
          var sel = document.getElementById("countryFilter");
          var currentVal = sel.value;
          sel.innerHTML = '<option value="">全部国家</option>' +
            Object.keys(countrySet).sort().map(function (c) {
              return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
            }).join("");
          sel.value = currentVal;

          renderStats();
          renderTable();
          showToast("加载完成");
        }).catch(function (err) {
          devices = [];
          var state = document.getElementById("stateRow");
          state.className = "state-row error";
          state.textContent = "网络错误：" + (err.message || err);
          renderStats(); renderTable();
          showToast("网络错误：" + (err.message || err), true);
        });
      }

      function normalizeDevice(d, i) {
        if (!d) d = {};
        var status = "offline";
        if (d.status === "online" || d.online === true || d.active === true || d.status === 0 || d.status === "0") status = "online";
        if (d.status === "error" || d.error === true || d.fault === true) status = "error";
        var type = d.type || d.device_type || d.category || d.kind || "-";
        if (typeof type !== "string") type = "设备";
        var country = d.country || d.region || "未知";
        var city = d.city || "";
        if (country === "中国" || country === "China" || country === "CN") {
          // 国内设备不展示
          country = "中国";
        }
        return {
          id: String(d.phone_id != null ? d.phone_id : (d.id != null ? d.id : "local-" + i)),
          code: String(d.code || d.phone_id || d.device_code || d.id || ("DEV-" + (i + 1))),
          name: d.phone_name || d.name || d.device_name || d.title || ("设备 " + (i + 1)),
          type: type,
          ip: d.ip || d.ip_address || d.last_ip || "-",
          status: status,
          loc: d.location || d.loc || d.address || d.position || "-",
          country: country,
          city: city,
          ping: typeof d.ping === "number" ? d.ping : (typeof d.latency === "number" ? d.latency : (status === "online" ? 80 + Math.floor(Math.random() * 200) : null)),
          proxy: d.proxy || d.proxy_node || proxyPool[i % proxyPool.length],
          lastTime: d.last_time || d.lastTime || d.last_heartbeat || d.updated_at || d.created_at || "-"
        };
      }

      function enrichOverseas(d) {
        // 基础的海外模拟字段
        var countryPool = ["美国", "日本", "新加坡", "德国", "英国", "韩国", "澳大利亚", "加拿大", "法国"];
        var cityPool = {
          "美国": "洛杉矶 / 纽约", "日本": "东京", "新加坡": "新加坡",
          "德国": "法兰克福", "英国": "伦敦", "韩国": "首尔",
          "澳大利亚": "悉尼", "加拿大": "多伦多", "法国": "巴黎"
        };
        d.country = countryPool[Math.abs(hashCode(d.id || d.code || "")) % countryPool.length];
        d.city = cityPool[d.country] || "-";
        d.ping = d.status === "online" ? 60 + Math.floor(Math.random() * 250) : null;
        d.proxy = proxyPool[Math.abs(hashCode(d.code || d.id)) % proxyPool.length];
        return d;
      }

      function hashCode(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
        return h;
      }

      function renderStats() {
        var total = devices.length;
        var online = devices.filter(function (d) { return d.status === "online"; }).length;
        var offline = devices.filter(function (d) { return d.status === "offline"; }).length;
        var onlineList = devices.filter(function (d) { return d.status === "online" && d.ping != null; });
        var avgPing = onlineList.length > 0
          ? Math.round(onlineList.reduce(function (a, b) { return a + b.ping; }, 0) / onlineList.length)
          : 0;
        document.getElementById("kpiTotal").textContent = total;
        document.getElementById("kpiOnline").textContent = online;
        document.getElementById("kpiOffline").textContent = offline;
        document.getElementById("kpiPing").textContent = avgPing + "ms";
      }

      function getFiltered() {
        var kw = document.getElementById("searchInput").value.trim().toLowerCase();
        var status = document.getElementById("statusFilter").value;
        var country = document.getElementById("countryFilter").value;
        return devices.filter(function (d) {
          var matchKw = !kw
            || String(d.name).toLowerCase().indexOf(kw) !== -1
            || String(d.code).toLowerCase().indexOf(kw) !== -1
            || String(d.ip).toLowerCase().indexOf(kw) !== -1
            || String(d.proxy || "").toLowerCase().indexOf(kw) !== -1;
          var matchStatus = !status || d.status === status;
          var matchCountry = !country || d.country === country;
          return matchKw && matchStatus && matchCountry;
        });
      }

      function renderTable() {
        var list = getFiltered();
        var pageSize = parseInt(document.getElementById("pageSize").value, 10);
        var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        document.getElementById("totalCount").textContent = list.length;
        document.getElementById("currentPage").textContent = currentPage;
        document.getElementById("totalPages").textContent = totalPages;

        var tbody = document.getElementById("deviceTableBody");
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:50px 0;color:var(--text-muted);font-size:12px;">暂无海外设备数据</td></tr>';
          document.getElementById("prevBtn").disabled = true;
          document.getElementById("nextBtn").disabled = true;
          return;
        }

        var start = (currentPage - 1) * pageSize;
        var pageItems = list.slice(start, start + pageSize);

        tbody.innerHTML = pageItems.map(function (d, i) {
          var statusText = d.status === "online" ? "在线" : (d.status === "error" ? "异常" : "离线");
          var statusCls = "badge-" + d.status;
          var pingCls = d.ping != null ? (d.ping < 100 ? "ping-good" : d.ping < 250 ? "ping-mid" : "ping-bad") : "";
          var pingText = d.ping != null ? d.ping + " ms" : "-";
          return '<tr>' +
            '<td style="color:var(--text-muted);font-size:12px;">' + (start + i + 1) + '</td>' +
            '<td class="code">' + escapeHtml(d.code) + '</td>' +
            '<td><b>' + escapeHtml(d.name) + '</b></td>' +
            '<td>' + escapeHtml(d.country) + '</td>' +
            '<td class="code">' + escapeHtml(d.city || "-") + '</td>' +
            '<td class="code">' + escapeHtml(d.ip) + '</td>' +
            '<td class="' + pingCls + '">' + pingText + '</td>' +
            '<td class="code">' + escapeHtml(d.proxy || "-") + '</td>' +
            '<td><span class="badge ' + statusCls + '">' + statusText + '</span></td>' +
            '<td style="color:var(--text-muted);font-size:12px;">' + escapeHtml(String(d.lastTime)) + '</td>' +
            '<td style="text-align:right;">' +
              '<div class="row-actions">' +
                '<button class="row-btn" onclick="openProxySwitch(' + safeQuote(d.id) + ')">切换代理</button>' +
              '</div>' +
            '</td>' +
            '</tr>';
        }).join("");

        document.getElementById("prevBtn").disabled = currentPage <= 1;
        document.getElementById("nextBtn").disabled = currentPage >= totalPages;
      }

      function changePage(delta) {
        if (delta !== 0) currentPage += delta;
        renderTable();
      }

      // 切换代理
      function openProxySwitch(id) {
        var d = devices.find(function (x) { return x.id === String(id); });
        if (!d) return;
        switchingId = String(id);
        document.getElementById("devName").textContent = d.name + " (" + d.code + ")";
        var sel = document.getElementById("proxySelect");
        sel.innerHTML = proxyPool.map(function (p) {
          return '<option value="' + escapeHtml(p) + '" ' + (p === d.proxy ? "selected" : "") + '>' + escapeHtml(p) + '</option>';
        }).join("");
        document.getElementById("proxyModal").classList.add("show");
      }

      function confirmProxySwitch() {
        var proxy = document.getElementById("proxySelect").value;
        showToast("正在切换代理节点：" + proxy);
        apiCall("/api/UpdateProxyNode.php", {
          token: getToken(), device_id: switchingId, proxy_node: proxy
        }).then(function (result) {
          var ok = !result || !result.error;
          if (ok) {
            var d = devices.find(function (x) { return x.id === switchingId; });
            if (d) d.proxy = proxy;
            closeModal("proxyModal");
            renderTable();
            showToast("代理节点切换成功");
          } else {
            showToast("切换失败：" + result.error, true);
          }
        }).catch(function (err) {
          // 接口不存在时，本地直接模拟成功
          var d = devices.find(function (x) { return x.id === switchingId; });
          if (d) d.proxy = proxy;
          closeModal("proxyModal");
          renderTable();
          showToast("代理节点切换成功（本地更新）");
        });
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("show");
        switchingId = null;
      }

      function escapeHtml(s) {
        if (s == null) return "";
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function safeQuote(s) {
        if (s == null) return "''";
        return "'" + String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
      }

      function logout() {
        ["ACCESS-TOKEN","CURRENT-USRNAME","CURRENT-EMAIL","CURRENT-AUTHORTY","CURRENT-USERID","CURRENT-USER"].forEach(function (k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
        window.location.href = "./index.html";
      }

      function showToast(text, isError) {
        var el = document.getElementById("toast");
        el.textContent = text;
        if (isError) el.classList.add("error"); else el.classList.remove("error");
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
      }

      // ESC 关闭 Modal
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          document.querySelectorAll(".modal").forEach(function (m) { m.classList.remove("show"); });
        }
      });

      init();
    </script>
  </body>
</html>
