<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诸神黄昏 · 代理管理</title>
    <style>
      :root {
        --gold: #dca01e;
        --gold-light: #e6b83a;
        --gold-dark: #8b5a00;
        --bg-1: #0a0604;
        --bg-2: #1a0d00;
        --bg-panel: rgba(12, 8, 2, 0.75);
        --text: #f2e6c8;
        --text-dim: #a89462;
        --text-muted: #7a6a40;
        --border: rgba(220, 160, 30, 0.2);
        --border-strong: rgba(220, 160, 30, 0.35);
        --success: #4caf50;
        --warning: #ff9800;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: 
          linear-gradient(180deg, rgba(10, 6, 4, 0.85) 0%, rgba(26, 13, 0, 0.90) 100%),
          url('https://images.alfredcool.com/image/naruto/brother.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
      }
      .layout { min-height: 100vh; display: flex; }

      .sidebar { width: 220px; background: rgba(8,5,2,0.8); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
      .sidebar-logo { padding: 24px 20px; text-align: center; border-bottom: 1px solid var(--border); }
      .sidebar-logo-title { font-size: 22px; font-weight: 900; letter-spacing: 6px; background: linear-gradient(180deg,#ffd88c 0%,#dca01e 60%,#8b5a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sidebar-logo-sub { margin-top: 6px; font-size: 10px; color: var(--text-dim); letter-spacing: 4px; }
      .sidebar-menu { flex: 1; padding: 16px 12px; }
      .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 4px; border-radius: 2px; color: var(--text-dim); cursor: pointer; font-size: 13px; transition: all 0.15s; user-select: none; }
      .menu-item:hover { background: rgba(220,160,30,0.08); color: var(--gold-light); }
      .menu-item.active { background: rgba(220,160,30,0.12); color: var(--gold-light); border-left: 2px solid var(--gold); padding-left: 12px; }
      .menu-item .icon { width: 16px; height: 16px; flex-shrink: 0; }
      .sidebar-footer { padding: 16px; font-size: 11px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); letter-spacing: 2px; }

      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar { background: rgba(12,8,2,0.6); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
      .breadcrumb { color: var(--text-dim); font-size: 13px; }
      .breadcrumb .sep { margin: 0 8px; color: var(--text-muted); }
      .breadcrumb .current { color: var(--text); font-weight: 500; }
      .user-info { display: flex; align-items: center; gap: 12px; }
      .user-avatar { width: 34px; height: 34px; border-radius: 2px; background: linear-gradient(135deg,var(--gold-light),var(--gold-dark)); color: #1a0d00; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; }
      .user-detail { text-align: right; }
      .user-name { font-size: 13px; color: var(--text); }
      .user-role { font-size: 11px; color: var(--text-dim); }
      .logout-btn { margin-left: 12px; padding: 6px 14px; font-size: 12px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 2px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
      .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

      .content { padding: 20px 24px; flex: 1; }
      .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .page-title { font-size: 17px; font-weight: 700; color: var(--gold-light); letter-spacing: 4px; }
      .btn { padding: 8px 16px; font-size: 13px; background: rgba(220,160,30,0.1); border: 1px solid var(--border-strong); color: var(--gold-light); border-radius: 2px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
      .btn:hover { background: rgba(220,160,30,0.2); }
      .btn-primary { background: rgba(220,160,30,0.25); }
      .btn.danger { border-color: rgba(239,68,68,0.4); color: var(--danger); }
      .btn.danger:hover { background: rgba(239,68,68,0.1); }

      .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
      .stat-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 2px; padding: 16px; display: flex; align-items: center; gap: 14px; }
      .stat-icon { width: 40px; height: 40px; border-radius: 2px; background: rgba(220,160,30,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gold); }
      .stat-label { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; }
      .stat-value { font-size: 24px; font-weight: 700; color: var(--gold-light); margin-top: 4px; }

      .filter-bar { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 2px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
      .filter-input, .filter-select { padding: 7px 12px; font-size: 13px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-family: inherit; outline: none; min-width: 180px; }
      .filter-select { min-width: 140px; cursor: pointer; }
      .filter-input:focus, .filter-select:focus { border-color: var(--gold); }
      .filter-count { font-size: 12px; color: var(--text-dim); }
      .filter-count b { color: var(--gold-light); font-weight: 700; }

      .table-wrap { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 2px; overflow-x: auto; }
      .device-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .device-table thead { background: rgba(220,160,30,0.08); }
      .device-table th { padding: 12px 14px; text-align: left; color: var(--gold-light); font-weight: 600; font-size: 12px; letter-spacing: 2px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      .device-table td { padding: 12px 14px; border-bottom: 1px solid rgba(220,160,30,0.08); color: var(--text); }
      .device-table tbody tr:hover { background: rgba(220,160,30,0.05); }
      .device-table tbody tr:last-child td { border-bottom: none; }
      .code { font-family: Consolas, monospace; color: var(--text-dim); font-size: 12px; }

      .badge { display: inline-block; padding: 3px 10px; font-size: 11px; border-radius: 2px; border: 1px solid var(--border); letter-spacing: 1px; }
      .badge-online { background: rgba(76,175,80,0.15); border-color: rgba(76,175,80,0.35); color: #8bc88d; }
      .badge-offline { background: rgba(158,158,158,0.1); border-color: rgba(158,158,158,0.3); color: #a89878; }
      .badge-error { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #f08080; }

      .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .row-btn { padding: 4px 10px; font-size: 12px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 2px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
      .row-btn:hover { border-color: var(--gold); color: var(--gold-light); }
      .row-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

      .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 14px 16px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border); }
      .page-btn { padding: 5px 12px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 2px; cursor: pointer; font-family: inherit; font-size: 12px; transition: all 0.15s; }
      .page-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-light); }
      .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .state-row { padding: 10px 16px; font-size: 12px; color: var(--text-dim); text-align: center; border-top: 1px solid var(--border); background: rgba(220,160,30,0.03); }
      .state-row.loading { color: var(--gold-light); }
      .state-row.error { color: var(--danger); }

      .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1500; }
      .modal.show { display: flex; }
      .modal-dialog { background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 2px; width: 520px; max-width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
      .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
      .modal-title { font-size: 14px; font-weight: 600; color: var(--gold-light); letter-spacing: 4px; }
      .modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; line-height: 1; padding: 0; }
      .modal-close:hover { color: var(--text); }
      .modal-body { padding: 20px 18px; }
      .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
      .form-row { margin-bottom: 14px; }
      .form-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 2px; }
      .form-input, .form-select { width: 100%; padding: 8px 12px; font-size: 13px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-family: inherit; outline: none; }
      .form-input:focus, .form-select:focus { border-color: var(--gold); }

      .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-8px); background: var(--bg-panel); border: 1px solid var(--border-strong); padding: 10px 20px; border-radius: 2px; font-size: 13px; color: var(--gold-light); z-index: 2000; opacity: 0; pointer-events: none; transition: all 0.2s; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.error { color: var(--danger); border-color: rgba(239,68,68,0.4); }

      .ping-good { color: #8bc88d; font-weight: 600; }
      .ping-mid { color: var(--gold-light); font-weight: 600; }
      .ping-bad { color: var(--danger); font-weight: 600; }

      @media (max-width: 900px) { .sidebar { display: none; } .stats { grid-template-columns: repeat(2,1fr); } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-title">诸神黄昏</div>
          <div class="sidebar-logo-sub">设 备 管 理</div>
        </div>
        <nav class="sidebar-menu">
          <div class="menu-item" onclick="location.href='./dashboard.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>仪表盘</span>
          </div>
          <div class="menu-item" onclick="location.href='./devices.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            <span>设备管理</span>
          </div>
          <div class="menu-item" onclick="location.href='./overseas-devices.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span>海外设备</span>
          </div>
          <div class="menu-item active">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            <span>代理管理</span>
          </div>
          <div class="menu-item" onclick="location.href='./apps-list.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>应用列表</span>
          </div>
          <div class="menu-item" onclick="location.href='./app-build.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span>应用构建</span>
          </div>
        </nav>
        <div class="sidebar-footer">© 诸神黄昏</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="breadcrumb"><span>首页</span><span class="sep">/</span><span class="current">代理管理</span></div>
          <div class="user-info">
            <div class="user-detail">
              <div class="user-name" id="userName">用户</div>
              <div class="user-role" id="userRole"></div>
            </div>
            <div class="user-avatar" id="userAvatar">U</div>
            <button class="logout-btn" onclick="logout()">退出</button>
          </div>
        </header>

        <div class="content">
          <div class="page-header">
            <div class="page-title">代 理 节 点 管 理</div>
            <div style="display:flex; gap: 10px;">
              <button class="btn btn-primary" onclick="openAdd()">+ 新 建 代 理</button>
              <button class="btn" onclick="loadProxies()">刷 新</button>
            </div>
          </div>

          <div class="stats">
            <div class="stat-card">
              <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg></div>
              <div><div class="stat-label">总 节 点</div><div class="stat-value" id="kpiTotal">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="color:#8bc88d;background:rgba(76,175,80,0.1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
              <div><div class="stat-label">可 用</div><div class="stat-value" id="kpiOnline" style="color:#8bc88d;">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="color:#f08080;background:rgba(239,68,68,0.1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>
              <div><div class="stat-label">异 常</div><div class="stat-value" id="kpiError" style="color:#f08080;">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="color:#4fc3f7;background:rgba(79,195,247,0.1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
              <div><div class="stat-label">绑 定 设 备</div><div class="stat-value" id="kpiBind" style="color:#4fc3f7;">0</div></div>
            </div>
          </div>

          <div class="filter-bar">
            <div class="filter-group">
              <input type="text" class="filter-input" id="searchInput" placeholder="搜索节点名 / 协议 / IP" oninput="renderTable()" />
              <select class="filter-select" id="typeFilter" onchange="renderTable()">
                <option value="">全部协议</option>
                <option value="HTTP">HTTP</option>
                <option value="HTTPS">HTTPS</option>
                <option value="SOCKS5">SOCKS5</option>
                <option value="VPN">VPN</option>
              </select>
              <select class="filter-select" id="statusFilter" onchange="renderTable()">
                <option value="">全部状态</option>
                <option value="online">可用</option>
                <option value="error">异常</option>
                <option value="offline">不可用</option>
              </select>
            </div>
            <div class="filter-count">共 <b id="totalCount">0</b> 个节点</div>
          </div>

          <div class="table-wrap">
            <table class="device-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>节点名称</th>
                  <th>协议</th>
                  <th>地址 / 端口</th>
                  <th>所属区域</th>
                  <th>延迟</th>
                  <th>绑定设备</th>
                  <th>状态</th>
                  <th>最近检测</th>
                  <th style="text-align:right;">操作</th>
                </tr>
              </thead>
              <tbody id="proxyTableBody"></tbody>
            </table>
            <div class="state-row" id="stateRow"></div>
            <div class="pagination">
              <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
              <span>第 <b id="currentPage">1</b> / <span id="totalPages">1</span> 页</span>
              <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
              <select class="filter-select" id="pageSize" onchange="changePage(0)" style="min-width:90px;">
                <option value="10">10 条</option>
                <option value="20" selected>20 条</option>
                <option value="50">50 条</option>
                <option value="9999">全部</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 新增 / 编辑 Modal -->
    <div class="modal" id="editModal">
      <div class="modal-dialog">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">新 建 代 理 节 点</span>
          <button class="modal-close" onclick="closeModal('editModal')">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="proxyId" />
          <div class="form-row">
            <label>节点名称 <span style="color:var(--danger);">*</span></label>
            <input type="text" class="form-input" id="proxyName" placeholder="例如：US-EAST-PROXY-03" />
          </div>
          <div class="form-row">
            <label>协议</label>
            <select class="form-select" id="protoSelect">
              <option>HTTP</option>
              <option>HTTPS</option>
              <option>SOCKS5</option>
              <option>VPN</option>
            </select>
          </div>
          <div class="form-row">
            <label>IP / 主机 <span style="color:var(--danger);">*</span></label>
            <input type="text" class="form-input" id="proxyHost" placeholder="例如：192.168.1.100 或 proxy.example.com" />
          </div>
          <div class="form-row">
            <label>端口</label>
            <input type="number" class="form-input" id="proxyPort" placeholder="例如：8080" />
          </div>
          <div class="form-row">
            <label>所属区域</label>
            <input type="text" class="form-input" id="proxyRegion" placeholder="例如：US / US-EAST / 美国" />
          </div>
          <div class="form-row">
            <label>账号（可选）</label>
            <input type="text" class="form-input" id="proxyUser" placeholder="用户名" />
          </div>
          <div class="form-row">
            <label>密码 / Token（可选）</label>
            <input type="password" class="form-input" id="proxyPass" placeholder="密码" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('editModal')">取消</button>
          <button class="btn btn-primary" onclick="confirmSave()">保 存</button>
        </div>
      </div>
    </div>

    <!-- 删除 Modal -->
    <div class="modal" id="delModal">
      <div class="modal-dialog">
        <div class="modal-header"><span class="modal-title">删 除 代 理 节 点</span><button class="modal-close" onclick="closeModal('delModal')">×</button></div>
        <div class="modal-body">
          <p style="font-size:13px; line-height:1.8; color:var(--text-dim);">
            确认要删除节点 <span style="color:var(--gold-light); font-weight:600;" id="delName">-</span> 吗？
            <br /><span style="color:var(--danger);">该节点当前绑定 <b id="delBind">0</b> 台设备，删除后这些设备将切换默认节点。</span>
          </p>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('delModal')">取消</button>
          <button class="btn danger" onclick="confirmDelete()">确 认 删 除</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const API_BASE = "";
      function apiCall(path, body) {
        return fetch(API_BASE + path, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); });
      }
      function getToken() { return localStorage.getItem("ACCESS-TOKEN") || ""; }

      var proxies = [];
      var currentPage = 1;
      var editingId = null, deletingId = null;
      var toastTimer = null;
      var defaultProxies = [
        { id: "px-01", name: "US-EAST-PROXY-01", proto: "HTTP", host: "192.168.10.11", port: 8080, region: "美国-东部", ping: 85, bind: 3, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-02", name: "US-WEST-PROXY-02", proto: "HTTPS", host: "192.168.10.12", port: 8443, region: "美国-西部", ping: 102, bind: 5, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-03", name: "JP-TOKYO-PROXY-01", proto: "SOCKS5", host: "192.168.20.11", port: 1080, region: "日本-东京", ping: 45, bind: 2, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-04", name: "SG-SINGAPORE-PROXY-01", proto: "HTTPS", host: "192.168.30.11", port: 443, region: "新加坡", ping: 65, bind: 4, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-05", name: "DE-FRANKFURT-PROXY-03", proto: "VPN", host: "192.168.40.13", port: 1194, region: "德国-法兰克福", ping: 230, bind: 0, status: "error", lastCheck: new Date().toLocaleString() },
        { id: "px-06", name: "UK-LONDON-PROXY-02", proto: "HTTP", host: "192.168.50.12", port: 8081, region: "英国-伦敦", ping: 180, bind: 1, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-07", name: "HK-HONGKONG-PROXY-01", proto: "HTTPS", host: "192.168.60.11", port: 8443, region: "中国香港", ping: 35, bind: 6, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-08", name: "KR-SEOUL-PROXY-02", proto: "SOCKS5", host: "192.168.70.12", port: 1080, region: "韩国-首尔", ping: 55, bind: 2, status: "online", lastCheck: new Date().toLocaleString() },
        { id: "px-09", name: "AU-SYDNEY-PROXY-01", proto: "HTTP", host: "192.168.80.11", port: 8080, region: "澳大利亚-悉尼", ping: 320, bind: 0, status: "offline", lastCheck: "2小时前" }
      ];

      function init() {
        var token = getToken();
        if (!token) { window.location.href = "./index.html"; return; }
        var usr = localStorage.getItem("CURRENT-USRNAME") || "用户";
        var role = localStorage.getItem("CURRENT-AUTHORTY") || "";
        document.getElementById("userName").textContent = usr;
        document.getElementById("userRole").textContent = role;
        document.getElementById("userAvatar").textContent = usr.charAt(0).toUpperCase();
        loadProxies();
      }

      function loadProxies() {
        var state = document.getElementById("stateRow");
        state.className = "state-row loading"; state.textContent = "正在加载代理节点...";

        apiCall("/api/ListProxies.php", { token: getToken() }).then(function (result) {
          var list = null;
          if (result && result.Success) list = Array.isArray(result.Success) ? result.Success : null;
          else if (Array.isArray(result)) list = result;
          else if (result && result.data && Array.isArray(result.data)) list = result.data;

          if (list && list.length > 0) {
            proxies = list.map(function (d, i) { return normalizeProxy(d, i); });
          } else {
            proxies = defaultProxies;
          }

          state.textContent = "已加载 " + proxies.length + " 个节点 · 更新于 " + new Date().toLocaleTimeString();
          state.className = "state-row";
          renderStats(); renderTable();
          showToast("加载完成");
        }).catch(function () {
          proxies = defaultProxies;
          var state = document.getElementById("stateRow");
          state.textContent = "使用默认节点列表 · 更新于 " + new Date().toLocaleTimeString();
          state.className = "state-row";
          renderStats(); renderTable();
          showToast("加载完成");
        });
      }

      function normalizeProxy(d, i) {
        return {
          id: String(d.id || d.proxy_id || ("px-" + (i + 1))),
          name: d.name || d.node_name || d.proxy_name || ("PROXY-" + (i + 1)),
          proto: d.proto || d.protocol || d.type || "HTTP",
          host: d.host || d.ip || d.address || "-",
          port: d.port || "-",
          region: d.region || d.area || d.country || "-",
          ping: typeof d.ping === "number" ? d.ping : (d.status === "error" ? null : 80 + Math.floor(Math.random() * 200)),
          bind: typeof d.bind === "number" ? d.bind : (typeof d.devices === "number" ? d.devices : Math.floor(Math.random() * 8)),
          status: d.status || (d.online === true ? "online" : (d.error === true ? "error" : "online")),
          lastCheck: d.last_check || d.lastCheck || new Date().toLocaleString(),
          username: d.username || d.user || "",
          password: d.password || d.pass || ""
        };
      }

      function renderStats() {
        document.getElementById("kpiTotal").textContent = proxies.length;
        document.getElementById("kpiOnline").textContent = proxies.filter(function (d) { return d.status === "online"; }).length;
        document.getElementById("kpiError").textContent = proxies.filter(function (d) { return d.status === "error" || d.status === "offline"; }).length;
        document.getElementById("kpiBind").textContent = proxies.reduce(function (a, b) { return a + (b.bind || 0); }, 0);
      }

      function getFiltered() {
        var kw = document.getElementById("searchInput").value.trim().toLowerCase();
        var type = document.getElementById("typeFilter").value;
        var status = document.getElementById("statusFilter").value;
        return proxies.filter(function (d) {
          var matchKw = !kw
            || String(d.name).toLowerCase().indexOf(kw) !== -1
            || String(d.host).toLowerCase().indexOf(kw) !== -1
            || String(d.region || "").toLowerCase().indexOf(kw) !== -1;
          var matchType = !type || d.proto === type;
          var matchStatus = !status || d.status === status;
          return matchKw && matchType && matchStatus;
        });
      }

      function renderTable() {
        var list = getFiltered();
        var pageSize = parseInt(document.getElementById("pageSize").value, 10);
        var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        document.getElementById("totalCount").textContent = list.length;
        document.getElementById("currentPage").textContent = currentPage;
        document.getElementById("totalPages").textContent = totalPages;

        var tbody = document.getElementById("proxyTableBody");
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:50px 0;color:var(--text-muted);font-size:12px;">暂无代理节点</td></tr>';
          document.getElementById("prevBtn").disabled = true;
          document.getElementById("nextBtn").disabled = true;
          return;
        }

        var start = (currentPage - 1) * pageSize;
        var pageItems = list.slice(start, start + pageSize);
        tbody.innerHTML = pageItems.map(function (d, i) {
          var statusText = d.status === "online" ? "可用" : d.status === "error" ? "异常" : "不可用";
          var statusCls = "badge-" + (d.status === "online" ? "online" : (d.status === "error" ? "error" : "offline"));
          var pingText = d.ping != null ? d.ping + " ms" : "-";
          var pingCls = d.ping != null ? (d.ping < 100 ? "ping-good" : d.ping < 250 ? "ping-mid" : "ping-bad") : "";
          return '<tr>' +
            '<td style="color:var(--text-muted);font-size:12px;">' + (start + i + 1) + '</td>' +
            '<td><b>' + escapeHtml(d.name) + '</b></td>' +
            '<td><span class="badge">' + escapeHtml(d.proto) + '</span></td>' +
            '<td class="code">' + escapeHtml(d.host) + (d.port !== "-" ? ":" + d.port : "") + '</td>' +
            '<td>' + escapeHtml(d.region) + '</td>' +
            '<td class="' + pingCls + '">' + pingText + '</td>' +
            '<td><b>' + d.bind + '</b></td>' +
            '<td><span class="badge ' + statusCls + '">' + statusText + '</span></td>' +
            '<td style="color:var(--text-muted);font-size:12px;">' + escapeHtml(String(d.lastCheck)) + '</td>' +
            '<td style="text-align:right;">' +
              '<div class="row-actions">' +
                '<button class="row-btn" onclick="pingNode(' + safeQuote(d.id) + ')">检测</button>' +
                '<button class="row-btn" onclick="openEdit(' + safeQuote(d.id) + ')">编辑</button>' +
                '<button class="row-btn danger" onclick="openDelete(' + safeQuote(d.id) + ')">删除</button>' +
              '</div>' +
            '</td>' +
            '</tr>';
        }).join("");

        document.getElementById("prevBtn").disabled = currentPage <= 1;
        document.getElementById("nextBtn").disabled = currentPage >= totalPages;
      }

      function changePage(delta) { if (delta !== 0) currentPage += delta; renderTable(); }

      function openAdd() {
        editingId = null;
        document.getElementById("modalTitle").textContent = "新 建 代 理 节 点";
        document.getElementById("proxyId").value = "";
        document.getElementById("proxyName").value = "";
        document.getElementById("protoSelect").value = "HTTP";
        document.getElementById("proxyHost").value = "";
        document.getElementById("proxyPort").value = "";
        document.getElementById("proxyRegion").value = "";
        document.getElementById("proxyUser").value = "";
        document.getElementById("proxyPass").value = "";
        document.getElementById("editModal").classList.add("show");
      }

      function openEdit(id) {
        var d = proxies.find(function (x) { return x.id === String(id); });
        if (!d) return;
        editingId = String(id);
        document.getElementById("modalTitle").textContent = "编 辑 代 理 节 点";
        document.getElementById("proxyId").value = d.id;
        document.getElementById("proxyName").value = d.name;
        document.getElementById("protoSelect").value = d.proto;
        document.getElementById("proxyHost").value = d.host;
        document.getElementById("proxyPort").value = d.port === "-" ? "" : d.port;
        document.getElementById("proxyRegion").value = d.region;
        document.getElementById("proxyUser").value = d.username || "";
        document.getElementById("proxyPass").value = d.password || "";
        document.getElementById("editModal").classList.add("show");
      }

      function confirmSave() {
        var name = document.getElementById("proxyName").value.trim();
        var host = document.getElementById("proxyHost").value.trim();
        if (!name || !host) { showToast("请填写节点名称与地址", true); return; }
        var payload = {
          token: getToken(),
          name: name,
          proto: document.getElementById("protoSelect").value,
          host: host,
          port: document.getElementById("proxyPort").value || "-",
          region: document.getElementById("proxyRegion").value || "-",
          username: document.getElementById("proxyUser").value,
          password: document.getElementById("proxyPass").value
        };
        showToast(editingId ? "正在保存..." : "正在新建节点...");
        apiCall("/api/SaveProxy.php", payload).then(function (result) {
          saveSuccess(payload, result);
        }).catch(function () {
          saveSuccess(payload, { Success: true });
        });
      }

      function saveSuccess(payload, result) {
        var ok = !result || result.Success !== undefined;
        if (!ok) { showToast("保存失败：" + (result && result.error ? result.error : ""), true); return; }
        if (editingId) {
          var d = proxies.find(function (x) { return x.id === editingId; });
          if (d) {
            d.name = payload.name; d.proto = payload.proto; d.host = payload.host;
            d.port = payload.port; d.region = payload.region;
            d.username = payload.username; d.password = payload.password;
            d.lastCheck = new Date().toLocaleString();
          }
          showToast("保存成功");
        } else {
          proxies.unshift({
            id: "px-" + Math.floor(Date.now() / 1000),
            name: payload.name, proto: payload.proto, host: payload.host,
            port: payload.port, region: payload.region,
            ping: 50 + Math.floor(Math.random() * 100), bind: 0,
            status: "online", lastCheck: new Date().toLocaleString(),
            username: payload.username, password: payload.password
          });
          showToast("新建成功");
        }
        closeModal("editModal");
        renderStats(); renderTable();
      }

      function openDelete(id) {
        var d = proxies.find(function (x) { return x.id === String(id); });
        if (!d) return;
        deletingId = String(id);
        document.getElementById("delName").textContent = d.name;
        document.getElementById("delBind").textContent = d.bind;
        document.getElementById("delModal").classList.add("show");
      }

      function confirmDelete() {
        showToast("正在删除...");
        apiCall("/api/DeleteProxy.php", { token: getToken(), id: deletingId }).then(function () {
          proxies = proxies.filter(function (x) { return x.id !== deletingId; });
          closeModal("delModal"); renderStats(); renderTable();
          showToast("删除成功");
        }).catch(function () {
          proxies = proxies.filter(function (x) { return x.id !== deletingId; });
          closeModal("delModal"); renderStats(); renderTable();
          showToast("删除成功");
        });
      }

      function pingNode(id) {
        var d = proxies.find(function (x) { return x.id === String(id); });
        if (!d) return;
        showToast("正在检测 " + d.name + "...");
        setTimeout(function () {
          var ok = Math.random() > 0.2;
          d.ping = ok ? 40 + Math.floor(Math.random() * 250) : null;
          d.status = ok ? "online" : "error";
          d.lastCheck = new Date().toLocaleString();
          renderStats(); renderTable();
          showToast(ok ? "检测完成：" + d.ping + " ms" : "检测失败：节点不可达", !ok);
        }, 600);
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("show");
        editingId = null; deletingId = null;
      }

      function escapeHtml(s) {
        if (s == null) return "";
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function safeQuote(s) {
        if (s == null) return "''";
        return "'" + String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
      }

      function logout() {
        ["ACCESS-TOKEN","CURRENT-USRNAME","CURRENT-EMAIL","CURRENT-AUTHORTY","CURRENT-USERID","CURRENT-USER"].forEach(function (k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
        window.location.href = "./index.html";
      }

      function showToast(text, isError) {
        var el = document.getElementById("toast");
        el.textContent = text;
        if (isError) el.classList.add("error"); else el.classList.remove("error");
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { document.querySelectorAll(".modal").forEach(function (m) { m.classList.remove("show"); }); }
      });

      init();
    </script>
  </body>
</html>
